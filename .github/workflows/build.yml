name: Build Possessed

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target Possessed_VST3 Possessed_Standalone
      - name: Build AU (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target Possessed_AU
      - uses: actions/upload-artifact@v4
        with:
          name: Possessed-${{ runner.os }}
          path: |
            readme.txt
            build/Possessed_artefacts/Release/VST3
            build/Possessed_artefacts/Release/AU
            build/Possessed_artefacts/Release/Standalone
